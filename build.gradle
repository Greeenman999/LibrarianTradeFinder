plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

tasks.withType(Jar).configureEach {
	archiveBaseName.set(project.archives_base_name)
}
def minecraftVersion = project.minecraft_version
def fabricApiVersion = providers.gradleProperty("fabric_api_version_${minecraftVersion}").orNull
def modMenuVersion = providers.gradleProperty("modmenu_version_${minecraftVersion}").orNull
if (fabricApiVersion == null || modMenuVersion == null) {
	throw new GradleException("Unsupported Minecraft target: ${minecraftVersion}. Use 26.2 or 26.3.")
}

version = "${project.mod_version}+mc${minecraftVersion}"
group = project.maven_group

sourceSets.main.java.srcDir("src/minecraft-${minecraftVersion}/java")

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    compileOnly("com.terraformersmc:modmenu:${modMenuVersion}")
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_version": minecraftVersion, "loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "LICENSE_${project.archives_base_name}" }
	}
}

loom {
	accessWidenerPath = file("src/main/resources/librarian-trade-finder.accesswidener")
}
